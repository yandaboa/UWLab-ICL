dataset:
  path: /home/ubuntu/lti/UWLab-ICL/50k_supervised_dataset_s_phys_rnge.pt

model:
  hidden_dims: [1024, 1024, 1024, 1024, 1024]
  loss_type: gaussian_nll
  normalize_action_targets: true
  action_norm_min_std: 1.0e-6
  log_std_min: -5.0
  log_std_max: 2.0

training:
  output_dir: logs/rsl_rl/supervised
  learning_rate: 3e-4
  weight_decay: 1e-4
  batch_size: 2048
  epochs: 300
  val_split: 0.25
  num_workers: 4
  seed: 42
  save_every_epochs: 5
  save_last: true
  use_wandb: true
  wandb_project: supervised_gaussian_policy
  wandb_run_name: limited_physics_params